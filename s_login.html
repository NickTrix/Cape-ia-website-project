<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>🏥 Alexandra Hospital</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="s_login.html" class="active">Staff Login</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <section class="login-section">
        <div class="login-box">
            <h2>Staff Login</h2>
            <p>Enter your credentials to access your portal</p>

            <form id="staff-login-form"">
                <label for="staff-id">Staff ID:</label>
                <input type="text" id="staff-id" name="staff-id" placeholder="Enter your Staff ID" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your Password" required>

                <button type="submit" class="btn">Login</button>
            </form>

            <p class="small-text">
                <b>Forgot your password? </b>  <a href="reset_password.html">Reset here</a>
            </p>

        </div>
    </section>

</body>

<footer>
    <div class="container">
        <p>&copy; 2026 Alexanhos-Web. All rights reserved.</p>
    </div>
</footer>
<script>document.getElementById('staff-login-form').addEventListener('submit', function(e) {
    e.preventDefault(); // prevent actual form submission
    const staffName = document.getElementById('staff-id').value;
    // redirect to dashboard with staff name in URL
    window.location.href = `staff_portal.html?name=${encodeURIComponent(staffName)}`;
});
</script>

</html>
