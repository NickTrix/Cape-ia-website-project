        <h2 class="center-title">Patient Bills</h2>

        <!-- Bills Table -->
        <section class="billing-section">

            <table>
                <thead>
                    <tr>
                        <th>Patient Name</th>
                        <th>Invoice #</th>
                        <th>Service</th>
                        <th>Amount (XCD)</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Jessica Moore</td>
                        <td>12345</td>
                        <td>Consultation</td>
                        <td>$150.00</td>
                        <td class="paid">Paid</td>
                        <td><button class="btn small">View</button></td>
                    </tr>

                    <tr>
                        <td>Mark Davis</td>
                        <td>12346</td>
                        <td>Lab Test</td>
                        <td>$75.00</td>
                        <td class="pending">Unpaid</td>
                        <td><button class="btn small danger">Send Reminder</button></td>
                    </tr>
                </tbody>

            </table>

        </section>

    </div>
