<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<header>
    <div class="container">
        <h1>🏥 Alexandra Hospital</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="p_login.html" class="active">Patient Login</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<section class="login-section">
    <div class="login-box">
        <h2>Patient Portal Login</h2>

        <form id="patient-login-form">
            <label for="patient-name">Patient ID:</label>
            <input type="text" id="patient-name" placeholder="Enter your patient ID" required>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit" class="btn">Login</button>
        </form>

        <p class="small-text">
            <b>Forgot your password?</b> <a href="reset_password.html">Reset here</a>
        </p>
    </div>
</section>

<footer>
    <div class="container">
        <p>&copy; 2026 Alexanhos-Web. All rights reserved.</p>
    </div>
</footer>

<script>
document.getElementById('patient-login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const patientName = document.getElementById('patient-name').value;
    window.location.href = `patient_dashboard.html?name=${encodeURIComponent(patientName)}`;
});
</script>

</body>
</html>
