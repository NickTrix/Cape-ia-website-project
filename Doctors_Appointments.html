<!-- Doctor Appointment Section -->
<section class="patient-dashboard">
    <div class="container">
        <h2>Book a Doctor Appointment</h2>
        <p>Please fill out the form below to schedule your appointment:</p>

        <form action="#" method="post">

            <h3>Patient Information</h3>

            <label>Full Name:</label><br>
            <input type="text" name="name" required><br><br>

            <label>Date of Birth:</label><br>
            <input type="date" name="dob" required><br><br>

            <label>Gender:</label><br>
            <select name="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select><br><br>

            <label>Phone Number:</label><br>
            <input type="tel" name="phone" required><br><br>

            <label>Email:</label><br>
            <input type="email" name="email"><br><br>

            <h3>Appointment Details</h3>

            <label>Select Doctor:</label><br>
            <select name="doctor">
                <option>Dr. Adams</option>
                <option>Dr. Brown</option>
                <option>Dr. Clarke</option>
            </select><br><br>

            <label>Department:</label><br>
            <select name="department">
                <option>General Medicine</option>
                <option>Pediatrics</option>
                <option>Cardiology</option>
            </select><br><br>

            <label>Appointment Type:</label><br>
            <input type="radio" name="type" value="inperson"> In-Person<br>
            <input type="radio" name="type" value="online"> Online<br><br>

            <label>Date:</label><br>
            <input type="date" name="date" required><br><br>

            <label>Time:</label><br>
            <input type="time" name="time" required><br><br>

            <label>Reason for Visit:</label><br>
            <textarea name="reason" rows="4"></textarea><br><br>

            <label>
                <input type="checkbox" required> I confirm the information is correct
            </label><br><br>

            <input type="submit" value="Book Appointment" class="btn">

        </form>

        <br>
        <a href="patient_dashboard.html">Back to Dashboard</a>
    </div>
</section>
